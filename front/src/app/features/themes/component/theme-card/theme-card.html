<article class="theme-card">
  <h2>{{ theme().title }}</h2>

  <p class="theme-description">
    {{ theme().description }}
  </p>

  <div class="theme-actions">
    @if (mode() === 'profile') {
      <button type="button" class="btn btn--primary" (click)="themeClicked.emit(theme().id)">
        Se désabonner
      </button>
    } @else {
      <button
        type="button"
        class="btn"
        (click)="themeClicked.emit(theme().id)"
        [class.btn--primary]="!theme().subscribed"
        [class.btn--disabled]="theme().subscribed"
        [disabled]="theme().subscribed">
        {{ theme().subscribed ? 'Déjà abonné' : "S'abonner" }}
      </button>
    }
  </div>
</article>
