<article class="article-card" [routerLink]="['/articles', article().id]">
  <h2>{{ article().title }}</h2>

  <div class="article-meta">
    <span>{{ article().createdAt | date:'d MMMM' }}</span>
    <span>{{ article().author }}</span>
  </div>

  <p class="article-content">
    {{ article().content }}
  </p>
</article>
