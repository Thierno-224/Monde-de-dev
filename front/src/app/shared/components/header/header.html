<header class="header">
  <a routerLink="/articles" class="header__logo" aria-label="Accueil MDD" (click)="closeMenu()">
    <img ngSrc="/assets/logo_p6.png" width="104" height="60" alt="MDD" priority>
  </a>

  <nav class="header__nav" aria-label="Navigation principale">
    <button class="header__logout" type="button" (click)="logout()">Se déconnecter</button>
    <a routerLink="/articles" routerLinkActive="active">Articles</a>
    <a routerLink="/themes" routerLinkActive="active">Thèmes</a>
    <a routerLink="/profile" class="header__profile" aria-label="Mon profil">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 22v-2a8 8 0 0 1 16 0v2"/>
      </svg>
    </a>
  </nav>

  <button class="header__toggle" type="button" aria-label="Ouvrir le menu"
          [attr.aria-expanded]="menuOpen()" aria-controls="mobile-menu" (click)="toggleMenu()">
    <span></span><span></span><span></span>
  </button>
</header>

@if (menuOpen()) {
  <div class="header__overlay" (click)="closeMenu()" aria-hidden="true"></div>
  <nav id="mobile-menu" class="header__mobile-nav" aria-label="Navigation mobile">
    <button class="header__logout" type="button" (click)="logout()">Se déconnecter</button>
    <a routerLink="/articles" (click)="closeMenu()">Articles</a>
    <a routerLink="/themes" (click)="closeMenu()">Thèmes</a>
    <a routerLink="/profile" class="header__mobile-profile" aria-label="Mon profil" (click)="closeMenu()">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 22v-2a8 8 0 0 1 16 0v2"/>
      </svg>
    </a>
  </nav>
}
